# 売買システムの設定。リスク上限はコード (trader/risk.py) で強制される。
broker: manual           # manual: Claude は注文案を出すだけで、人が楽天証券で発注する / paper: 仮想売買
timezone: Asia/Tokyo
default_account: nisa_growth  # 新しく買う株の口座区分 (NISA成長投資枠の残りがある限り)
base_currency: JPY       # 評価・リスク計算はすべて円換算。現金も円貨決済前提で円にまとめて持つ

history_days: 400        # 取得する日足の暦日数 (SMA200 の計算に足りる量)

markets:                 # ティッカーのサフィックスで市場を判定
  ".T": {currency: JPY, lot_size: 1}     # かぶミニ (単元未満株) を使う前提で1株単位
  default: {currency: USD, lot_size: 1}

fx_tickers:              # 為替レートの取得元 (Yahoo Finance)
  USD: JPY=X

risk:
  max_position_pct: 0.25     # 1銘柄あたりの評価額上限 (総資産比)。超えている銘柄は買い増し不可になるだけ
  min_cash_pct: 0.05         # 買付後に残す現金比率
  max_orders_per_day: 5
  max_drawdown_pct: 0.15     # 最高値からこれ以上下落したら新規買いを停止 (売りは可)
  price_buffer: 0.03         # 成行の見積りに使う不利方向の価格変動幅
  max_limit_deviation: 0.10  # 指値が前日終値から離れすぎていたら拒否

execution:                   # paper モードの約定条件
  slippage_bps: 10
  commission_bps: 0

nisa:                        # NISA の枠 (楽天証券「NISA」画面の値。週次の照合のときに更新する)
  year: 2026
  as_of: 2026-10-22
  growth_remaining: 1292350  # 成長投資枠の残り (年240万円のうち 1,107,650円を利用済み)
  tsumitate_remaining: 1200000  # つみたて投資枠の残り (未使用)
