# フォワードテスト: 下のルールを start の日の終値から実データで記録する (実際の口座とは別の仮想口座、各100万円)。
# 過去データでの検証と違い、ルールを決めた後のデータなので、一番信用できる確かめ方になる。
# python3 -m trader forward で最新の成績を計算する (週次リサーチで実行)。
start: 2026-10-21
rules:
  - name: s4-combined
    path: rules/candidates/2026-10-20-s4-combined.yaml
    label: v2 (2026-10-22〜24 の実際の口座のルール)
  - name: v3-earnings-blackout
    path: rules/candidates/2026-10-24-e1-entry-blackout.yaml
    label: 採用中 (2026-10-24 から実際の口座のルール v3。採用は 10/24 なので 10/21〜23 の分は後付け)
  - name: momentum-12-1
    path: rules/candidates/2026-10-21-momentum-12-1.yaml
    label: 参考 (通算リターンは最大だが、下落幅の基準が未達)
  - name: v1
    path: rules/archive/v1.yaml
    label: 以前のルール (比較用)
  - name: swap-gap20
    path: rules/candidates/2026-10-24-w1-swap-gap20.yaml
    label: 参考 (v3 + 弱い保有の入れ替え。リターンは大きく上がったが下落の基準が未達。2026-10-24 から追加)
  - name: dip15-trend
    path: rules/candidates/2026-11-10-d1-dip15-trend.yaml
    label: 参考 (v3 + AI 半導体の押し目買いの別枠。リターンは増えたが下落の基準が未達。2026-11-10 から追加なので 10/21〜11/10 の分は後付け)
  - name: atr3
    path: rules/candidates/2026-11-13-s2-atr3.yaml
    label: 参考 (v3 + 損切り幅を ATR × 3。2005〜2018年でもリターンは v3 より高かった。2026-11-14 から追加なので 10/21〜11/13 の分は後付け)
  - name: v4-draft
    path: rules/candidates/2026-11-14-v4-draft.yaml
    label: 参考 (v3 + ATR × 3 + 弱い保有の入れ替え。入れ替えだけの swap-gap20 より良いかは未確認。2026-11-14 から追加なので 10/21〜11/13 の分は後付け)
