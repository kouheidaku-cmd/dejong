# surge の設定。売買ルールの数字 (params) は検証 (reports/surge/2026-11-13-validation.md) とセットなので、
# 変えるときは `python -m surge backtest` と `python -m surge robust` で確かめてから。
params:
  score: blend              # 順位づけ: 過去 3・6・12か月の値上がり率の平均
  lookbacks: [63, 126, 252]
  skip: 0
  top_n: 5                  # 同時に持つ銘柄数 (1銘柄あたり総資産の 19%)
  hold_rank: 20             # 保有中の銘柄は 20位以内なら持ち続ける
  entry_sma: 200            # 終値が 200日線より上の銘柄だけ買う
  exit_sma: 200             # 終値が 200日線を割ったら売る (週次)
  near_high: 0.15           # 直近126日の最高値から 15% 以内にいる銘柄だけ買う (落ちている途中の銘柄を買わない)
  high_window: 126
  max_per_group: 2          # 同じ group (universe.yaml) は2銘柄まで
  liquid_frac: 0.6          # 売買代金が、その市場 (日本 / 米国) の母集団の上位 60% に入る銘柄だけ
  min_history: 280
  markets: [USD]            # 買う対象は米国株だけ (日本株は検証でモメンタムが効かなかった。[USD, JPY] で両方)
  regime_sma: 200           # 指数 (S&P500 / 日経平均) が 200日線より下の市場では新規に買わない
  regime_exit: false
  breadth_min: null
  trail_stop: 0.25          # 買ってからの最高終値から 25% 下げたら売る (毎日判定)
  cash_buffer: 0.05         # 現金で残す割合
  vol_cap: null             # リスクを下げたいとき: 0.5 にすると値動きの大きい銘柄の金額を減らす
  vol_window: 63
  topup_below: 0.6          # 持ち続ける銘柄が目標の金額の 60% より小さく、今も買いの条件を満たすなら、目標まで買い増す
  trim_above: 0.35          # 1銘柄が総資産の 35% を超えたら 19% まで減らす
  rebalance: W              # 週1回 (週末) に入れ替えを判定
  rebalance_every: 1
  rebalance_offset: 0

execution:
  cost: 0.002               # 検証で引く片道の売買コスト (NISA の米国株・かぶミニ寄付は手数料0。値のずれの分)
  price_buffer: 0.03        # 注文案の株数を決めるとき、約定価格が終値よりこれだけ不利になると見ておく
  max_weight_mult: 1.3      # 整数株への丸めで、目標の金額をこの倍率まで超えてよい

goal:                       # 目標の進み具合を status で表示する
  start_date: 2026-11-14    # surge で運用すると人が決めた日 (最初の注文案の日)
  start_equity: 405316      # 開始時点の 株 + 現金 (円)。日本株・米国株とも 11/13 の終値。投資信託は含めない
  target_return: 0.20
  months: 4
